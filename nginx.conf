server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compressao gzip para HTML, CSS, JS, SVG e PDF
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/pdf
        image/svg+xml;

    # Cabecalhos de seguranca
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck para Coolify / Traefik / Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cache longo para assets estaticos (imagens, badges e logos)
    location ~* ^/assets/.*\.(svg|jpg|jpeg|png|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Revalidacao rapida para paginas, estilos, scripts e curriculo em PDF
    location ~* \.(html|css|js|pdf)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Suporta rotas com ou sem .html (/certificacoes -> /certificacoes.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
