server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compressao Gzip para HTML, CSS, JS, JSON, XML, Manifest, SVG, TXT e PDF
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/ld+json
        application/rss+xml
        application/xml
        application/opensearchdescription+xml
        application/pdf
        image/svg+xml;

    # Edge HTTP Security & Technical SEO Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" always;

    # Healthcheck para Coolify / Traefik / Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # MIME type explicito para Web App Manifest
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Protocolos de rastreamento, IA/GEO e Sitemaps (robots.txt, llms.txt, sitemaps, rss, indexnow)
    location ~* ^/(robots\.txt|llms\.txt|llms-full\.txt|8f4e2a9c1d7b3e6f5a0c8d2e4b9a1f3c\.txt|sitemap\.xml|sitemap_index\.xml|feed\.xml|opensearch\.xml|browserconfig\.xml)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Cache longo para assets estaticos, favicons e OG images
    location ~* ^/(assets/|public/)?.*\.(svg|jpg|jpeg|png|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Revalidacao rapida para paginas HTML, estilos, scripts, JSON API e curriculo em PDF
    location ~* \.(html|css|js|pdf|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" always;
        try_files $uri =404;
    }

    # Suporta rotas com ou sem .html (/certificacoes -> /certificacoes.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
